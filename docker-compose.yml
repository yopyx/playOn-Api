services:
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      KC_DB_URL: jdbc:postgresql://${KEYCLOAK_DB_HOST}:${KEYCLOAK_DB_PORT}/${KEYCLOAK_DB_NAME}?sslmode=verify-full
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # KC_HOSTNAME: localhost
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  bff:
    build:
      context: .
      dockerfile: BFF/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${BACKEND_DB_CONNECTION_STRING}
      # Update this key to match whatever your BFF's Program.cs actually reads
      # for options.Authority. Service name "keycloak" resolves on this
      # compose network; KC_HOSTNAME=localhost above keeps the issued
      # token's issuer matching what the browser sees.
      OIDC__Authority: http://keycloak:8080/realms/${KC_REALM_NAME}
      OIDC__PublicAuthority: http://localhost:8080/realms/${KC_REALM_NAME}
      ResourceApi__BaseUrl: ${RESOURCES_API_URL}
    env_file:
      - .env
    ports:
      - "7117:8080"
    depends_on:
      keycloak:
        condition: service_healthy

  playon:
    build:
      context: .
      dockerfile: playOn/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${BACKEND_DB_CONNECTION_STRING}
      OIDC__Authority: http://keycloak:8080/realms/${KC_REALM_NAME}
    env_file:
      - .env
    ports:
      - "7287:8080"
    depends_on:
      keycloak:
        condition: service_healthy
